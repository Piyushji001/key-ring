[package]
name = "keyring-crypto"
version = "0.1.0"
edition = "2021"
description = "Isolated cryptographic core for Keyring. No application dependencies."
license = "MIT"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
hex = "0.4"
proptest = "1.4"
